plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
}

android {
    namespace 'ca.visionassistinnovators.it.smartassistivesystem'
    compileSdk 36

    defaultConfig {
        applicationId "ca.visionassistinnovators.it.smartassistivesystem"
        minSdk 28
        targetSdk 36
        versionCode 2
        versionName "1.0.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }

    // ✅ Needed so Robolectric can load resources (strings, layouts, etc.)
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation libs.androidx.espresso.core
    implementation libs.androidx.junit

    // ✅ CameraX dependencies
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation "androidx.camera:camera-extensions:$camerax_version"

    // Charts & Maps / Location
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.2.0'

    // ✅ Core + Material + Splash
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation 'com.google.android.material:material:1.12.0'

    // ✅ Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.1.0'

    // ✅ Firebase
    implementation 'com.google.firebase:firebase-database'
    implementation libs.firebase.database
    implementation libs.firebase.auth

    // ✅ AndroidX essentials
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.preference

    // ------------------------
    // ✅ Testing dependencies
    // ------------------------

    // Local unit tests (JUnit – from version catalog)
    testImplementation libs.junit

    // Robolectric & AndroidX test core for JVM tests with Context/resources
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'

    // Instrumented tests
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Extra AndroidX test rules (useful for ActivityScenarioRule etc.)
    androidTestImplementation 'androidx.test:rules:1.5.0'
}
